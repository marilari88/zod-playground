name: main

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ✅ Checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
      - name: Install dependencies
        run: npm ci
      - name: Biome check
        run: npm run biome:ci
      - name: Types and build checks
        run: npm run build

  test:
    name: 🧪 Tests
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          check-latest: true
      - name: Install dependencies
        run: npm ci
      - name: Install test browsers
        run: npm run test:install
      - name: Run tests
        run: npm run test
